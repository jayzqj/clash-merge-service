# xiuyuan.9527653.xyz — OpenResty / 1Panel site snippet.
# Put the location blocks below INSIDE the existing server block
# for xiuyuan.9527653.xyz (which already has ssl / root / logs).
#
# DO NOT use the old placeholder:
#   proxy_pass http://127.0.0.1:80;   <-- wrong, proxies to itself
#
# Backend service listens on 127.0.0.1:18080 (see deploy/clash-merge.service).
# The subscription YAML is served BY THE SERVICE behind a secret token;
# nginx never serves it as a static file, and no copy may live in the
# site root.
#
# Login throttling: the service itself locks an IP for 15 minutes after
# 5 wrong admin passwords (it trusts X-Real-IP from nginx). Optionally add
# a request rate limit in nginx too; the zone must be declared in the
# http {} block (1Panel: OpenResty "配置修改" / nginx.conf), e.g.
#   limit_req_zone $binary_remote_addr zone=clash_admin:1m rate=30r/m;
# and then uncomment the limit_req lines in /admin and /api/ below.

server {
    listen 443 ssl;
    server_name xiuyuan.9527653.xyz;
    # ... existing ssl_certificate / root / logs stay as they are ...

    # Admin UI + API -> backend service (login required, HTTP Basic).
    location /admin {
        # limit_req zone=clash_admin burst=20 nodelay;
        proxy_pass http://127.0.0.1:18080/admin;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/ {
        # limit_req zone=clash_admin burst=20 nodelay;
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A full purity round can take tens of minutes; the /api/run
        # call itself returns immediately, but keep this generous.
        proxy_read_timeout 120s;
    }

    # Final subscription: /subscription/<token>/jay_filtered.yaml.
    # The service checks the token (wrong token -> 404) and sends
    # Cache-Control: no-store. The path contains the token, so keep it
    # out of the access log.
    location /subscription/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # The old public address is retired. Answer 404 even if a stale
    # copy is ever left in the site root.
    location = /jay_filtered.yaml {
        return 404;
    }
}
