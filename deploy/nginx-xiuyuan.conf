# xiuyuan.9527653.xyz — OpenResty / 1Panel site snippet.
# Put the two location blocks below INSIDE the existing server block
# for xiuyuan.9527653.xyz (which already has ssl / root / logs).
#
# DO NOT use the old placeholder:
#   proxy_pass http://127.0.0.1:80;   <-- wrong, proxies to itself
#
# Backend service listens on 127.0.0.1:18080 (see deploy/clash-merge.service).
# The YAML output is a static file written by the service.

server {
    listen 443 ssl;
    server_name xiuyuan.9527653.xyz;
    # ... existing ssl_certificate / root / logs stay as they are ...

    # Admin UI + API -> backend service (login required, HTTP Basic).
    location /admin {
        proxy_pass http://127.0.0.1:18080/admin;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A full purity round can take tens of minutes; the /api/run
        # call itself returns immediately, but keep this generous.
        proxy_read_timeout 120s;
    }

    # Final subscription -> static file. The service atomically
    # replaces this file on each successful round; the URL never changes.
    location = /jay_filtered.yaml {
        alias /var/www/xiuyuan/jay_filtered.yaml;
        default_type text/yaml;
        add_header Cache-Control "no-cache";
    }
}
